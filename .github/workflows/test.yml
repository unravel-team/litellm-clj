name: Tests

on:
  push:
    branches:
      - "*"
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java: ['11', '17', '21']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      
      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      
      - name: Install Clojure tools
        uses: DeLaGuardo/setup-clojure@bc7570e912b028bbcc22f457adec7fdf98e2f4ed # 12.5
        with:
          cli: 1.11.1.1413
      
      - name: Install dependencies
        run: clojure -Srepro -P -M:test
      
      - name: Check workflow security
        run: ruby test/security/workflows_test.rb

      - name: Run tests
        run: make test
      
      - name: Generate coverage report (JDK 17 only)
        if: matrix.java == '17'
        run: clojure -Srepro -M:test:coverage
      
      - name: Upload coverage to Codecov (main pushes only)
        if: matrix.java == '17' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ./target/coverage/codecov.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Retain coverage report (JDK 17 only)
        if: matrix.java == '17'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: target/coverage/
          retention-days: 7
