name: Tests

on:
  push:
    branches:
      - "*"
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java: ['11', '17', '21']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      
      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      
      - name: Install Clojure tools
        uses: DeLaGuardo/setup-clojure@bc7570e912b028bbcc22f457adec7fdf98e2f4ed # 12.5
        with:
          cli: 1.11.1.1413
      
      - name: Cache dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn', '**/tests.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-
      
      - name: Install dependencies
        run: clojure -P -M:test
      
      - name: Check workflow security
        run: ruby test/security/workflows_test.rb

      - name: Run tests
        run: make test
      
      - name: Generate coverage report (JDK 17 only)
        if: matrix.java == '17'
        run: clojure -M:test:coverage
      
      - name: Retain coverage report (JDK 17 only)
        if: matrix.java == '17'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: target/coverage/
          retention-days: 7
